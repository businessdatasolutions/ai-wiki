name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build -d wiki
      # Standalone HTML artifacts under inspiration/ are not part of the wiki corpus,
      # so Quartz never sees them. Copy them into the built site so they get published
      # at /inspiration/<name>.html. Relative links between them keep working.
      - name: Copy standalone pages into the site
        run: |
          mkdir -p public/inspiration
          cp inspiration/ai-worker-maturity-*.html public/inspiration/
          ls -la public/inspiration/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
